      <span class="pill">${a.pnl_krw >= 0 ? '▲' : '▼'} ${signed(a.pnl_krw)} · ${pct(a.pnl_pct)}</span>

  <div class="livebar">
    <span class="dot"></span>
    <span>11/20 장중 10:30 ET 기준 <b class="${cls(liveDiff)}">${signed(liveDiff)}</b> · ${pct(a.live_pnl_pct)}</span>
  </div>

  <div class="sec"><h2>자산 배분</h2><span>주식 ${a.stock_pct}% · 현금 ${a.cash_pct}%</span></div>
  <div class="card">
    <div class="alloc">
      ${DATA.positions.map(p => `<i style="width:${p.weight_pct}%;background:${p.sleeve === 'core' ? '#1B5E4B' : '#C8A24A'}"></i>`).join('')}

    </div>
    <div class="leg">
      ${DATA.positions.map(p => `
        <div class="lg"><i style="background:${p.sleeve === 'core' ? '#1B5E4B' : '#C8A24A'}"></i><span>${p.kor} <em>${p.sleeve === 'core' ? '코어' : '새틀라이트'}</em></span><b>${p.weight_pct}%</b></div>`).join('')}
      <div class="lg"><i style="background:#D9D3C6"></i><span>현금</span><b>${a.cash_pct}%</b></div>
    </div>
  </div>

  <div class="sec"><h2>보유 종목</h2><span>${DATA.positions.length}종목 · 현금 ${a.cash_pct}%</span></div>
  ${DATA.positions.map(posCard).join('')}

  <div class="card note">
    <div class="noteh">이번 진입이 '현금 5%'로 끝난 이유</div>
    <p>새틀라이트 슬롯은 40%지만 종목당 상한이 35%입니다. 오늘 세 조건을 통과한 대형주가 AAPL 하나뿐이라 35%만 배분하고, 남은 5%는 억지로 채우지 않고 현금으로 남겼습니다. 조건에 맞는 종목이 늘면 다음 리밸런싱에서 채웁니다.</p>
  </div>`;
}

function posCard(p) {
  const pnl = p.value_krw - p.cost_krw;
  const rng = p.tp_usd - p.stop_usd;
  const at = Math.min(100, Math.max(0, (p.entry_usd - p.stop_usd) / rng * 100));
  return `
  <div class="card pos">
    <div class="pos-top">
      <div>
        <div class="tick">${p.sym} <span class="sl">${p.sleeve === 'core' ? '코어' : '새틀라이트'}</span></div>
        <div class="nm">${p.kor} · ${sh(p.shares)}주</div>
      </div>
      <div class="pnl ${cls(pnl)}">
        ${signed(pnl)}
        <small>${pct(pnl / p.cost_krw * 100)}</small>
      </div>
    </div>
    ${sparkline(p, p.spark_chg >= 0)}
    <div class="g3">
      <div><div class="k">매입금액</div><div class="v">${won(p.cost_krw)}</div></div>
      <div><div class="k">평가액</div><div class="v">${won(p.value_krw)}</div></div>
      <div><div class="k">평단가</div><div class="v">${usd(p.entry_usd * 1.0025)}</div></div>
    </div>
    <div class="range">
      <div class="lbl"><span>손절 ${usd(p.stop_usd)}</span><span>익절 ${usd(p.tp_usd)}</span></div>
      <div class="track"><div class="marker" style="left:calc(${at}% - 1.5px)"></div></div>
      <div class="lbl2">진입 ${usd(p.entry_usd)} · ${p.sleeve === 'core' ? '코어 60%' : '새틀라이트 35% (상한)'} · 60일 수익률 ${pct(p.ind.ret60)}</div>
    </div>
  </div>`;
}

function renderTab1() {
  return `
  <div class="sec"><h2>매수 로그</h2><span>2026-11-19 종가 체결</span></div>
  ${DATA.trades.map(t => `
    <div class="card trade">
      <div class="trade-top">
        <div>
          <span class="badge">${t.side}</span>
          <span class="tick2">${t.sym}</span>
          <span class="nm2">${t.name}</span>
        </div>
        <div class="tamt">${won(t.amount_krw)}</div>
      </div>
      <div class="trade-grid">
        <div><span>수량</span><b>${sh(t.shares)}주</b></div>
        <div><span>체결가</span><b>${usd(t.price_usd)}</b></div>
        <div><span>금액</span><b>${usd(t.amount_usd)}</b></div>
        <div><span>수수료</span><b>${usd(t.fee_usd)}</b></div>
      </div>
      <div class="tnote">${t.note} · 환율 1,339.4원</div>
    </div>`).join('')}
  <div class="empty">매도 내역 없음 · 손절 −7% / 익절 +15% 도달 시 다음 업데이트에서 기록</div>

  <div class="sec"><h2>왜 이 종목인가</h2><span>실측 지표 근거</span></div>
  ${DATA.positions.map(p => `
    <div class="card why">
      <div class="why-h"><span class="tick">${p.sym}</span><span class="nm2">${p.kor}</span></div>
      <div class="kv"><span>종가</span><b>${usd(p.ind.close)}</b></div>
      <div class="kv"><span>20일 이평</span><b>${usd(p.ind.sma20)} <em class="${cls(p.ind.d20)}">${pct(p.ind.d20)}</em></b></div>
      <div class="kv"><span>60일 이평</span><b>${usd(p.ind.sma60)} <em class="${cls(p.ind.d60)}">${pct(p.ind.d60)}</em></b></div>
      <div class="kv"><span>200일 이평</span><b>${usd(p.ind.sma200)} <em class="${cls(p.ind.d200)}">${pct(p.ind.d200)}</em></b></div>
      <div class="kv"><span>RSI(14)</span><b>${p.ind.rsi14} <em>${p.ind.rsi14 > 70 ? '과열' : p.ind.rsi14 < 30 ? '과매도' : '중립'}</em></b></div>
      <div class="kv"><span>60일 수익률</span><b class="${cls(p.ind.ret60)}">${pct(p.ind.ret60)}</b></div>
      <div class="kv"><span>52주 고점 대비</span><b class="${cls(p.ind.fromHi)}">${pct(p.ind.fromHi)}</b></div>
      <div class="reason">${DATA.reasons[p.sym].map(r => `<p>${r}</p>`).join('')}</div>
    </div>`).join('')}

  <div class="sec"><h2>관망 종목</h2><span>신호 미충족 → 매수 안 함</span></div>
  <div class="card watch">
    ${DATA.watch.map(w => `
      <div class="wrow">
        <div class="wt"><span>${w.sym}</span><em>${w.kor}</em></div>
        <div class="ww">${w.why}</div>
      </div>`).join('')}
  </div>`;
}

function renderTab2() {
  return `
  <div class="sec"><h2>적용 룰 v1</h2><span>듀얼 모멘텀 · 50만 원</span></div>
  ${DATA.rules.map(r => `
    <div class="card rule">
      <div class="rule-h"><span class="no">${r.no}</span><span class="rt">${r.t}</span></div>
      <p>${r.b}</p>
    </div>`).join('')}

  <div class="sec"><h2>룰 성적 검증</h2><span>지난 2년 일봉 · 신호 후 20거래일</span></div>
  <div class="card">
    <table class="bt">
      <thead><tr><th>종목</th><th>신호 후 평균</th><th>승률</th><th>그냥 보유</th></tr></thead>
      <tbody>
        ${DATA.backtest.map(b => `
          <tr>
            <td class="l">${b.sym}<em>n=${b.n}</em></td>
            <td class="${cls(b.avg)}">${pct(b.avg)}</td>
            <td>${b.win.toFixed(1)}%</td>
            <td class="muted">${pct(b.base)}</td>
          </tr>`).join('')}
      </tbody>
    </table>
    <p class="cap">'신호 후 평균'은 ①종가>60일선 ②60일 수익률>0 ③RSI 40~70을 만족한 날의 이후 20거래일 수익률 평균입니다. '그냥 보유'는 같은 종목을 아무 날이나 산 경우의 평균. 이 표는 미래 수익을 보장하지 않습니다.</p>
  </div>

  <div class="sec"><h2>튜닝 노트</h2><span>4주간 검증할 3가지</span></div>
  ${DATA.tuning.map(t => `
    <div class="card tune">
      <div class="tag">${t.tag}</div>
      <div class="tt">${t.t}</div>
      <p>${t.b}</p>
      <div class="next"><b>다음 확인</b> ${t.next}</div>
    </div>`).join('')}

  <div class="sec"><h2>체크포인트</h2><span>손절·익절 자동 점검</span></div>
  <div class="card">
    <div class="tl">
      ${DATA.checkpoints.map(c => `
        <div class="chk">
          <div class="cd">${c.d} <em>${c.when}</em></div>
          <ul>${c.items.map(i => `<li>${i}</li>`).join('')}</ul>
        </div>`).join('')}
    </div>
  </div>

  <div class="card foot">
    <div class="fh">데이터·한계</div>
    <p>가격·지표는 2026-11-19 미국장 종가(야후 파이낸스 일봉)로 직접 계산했습니다. SMA는 단순이동평균, RSI는 14일 윌더 방식입니다. 환율은 1,339.4원/달러 고정이라 실제 환차손익은 반영되지 않았습니다. 소수점 매수 가능한 증권사(토스증권 등)를 가정했습니다.</p>
    <p class="warn">이 화면은 공부용 시뮬레이션이며 투자 권유가 아닙니다. 실제 주문은 이루어지지 않았습니다.</p>
    <div class="meta2">state · ${DATA.version} · ${DATA.meta.asof} · <a href="stock_portfolio_data.json">JSON</a></div>
  </div>`;
}

let cur = 0;
function render(i) {
  cur = i;
  document.getElementById('view').innerHTML = [renderTab0, renderTab1, renderTab2][i]();
  document.querySelectorAll('.tab').forEach((b, k) => b.classList.toggle('on', k === i));
  window.scrollTo({top: 0, behavior: 'auto'});
}

function paintHeader() {
  document.getElementById('hdsub').textContent = DATA.meta.asof_label;
  document.getElementById('fxbadge').innerHTML = `환율<b>${DATA.meta.fx.toLocaleString('ko-KR')}원</b>`;
}

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  render(Number(b.dataset.tab));
});
paintHeader();
render(0);

// 최신 상태 파일이 있으면 그것으로 다시 그린다 (다음 업데이트는 JSON만 교체하면 됨)
fetch('stock_portfolio_data.json', {cache: 'no-store'})
  .then(r => r.ok ? r.json() : null)
  .then(d => { if (d && d.account) { Object.assign(DATA, d); paintHeader(); render(cur); } })
  .catch(() => {});
</script>
