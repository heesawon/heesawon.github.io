let marketFilter = 'ALL';
let showExamples = false;
let periodMode = 'week';

/* ---------- utils ---------- */
const KR = n => Math.round(Number(n) || 0).toLocaleString('ko-KR');
const won = n => KR(n) + '원';
const wonShort = n => {
  const v = Math.round(Number(n) || 0);
  if (Math.abs(v) >= 100000000) return (v / 100000000).toFixed(1) + '억원';
  if (Math.abs(v) >= 10000) return Math.round(v / 10000).toLocaleString('ko-KR') + '만원';
  return KR(v) + '원';
};
const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '') + KR(Math.abs(n)) + '원';
const pct = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(Number(n) || 0).toFixed(2) + '%';
const dir = n => (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = d => { if (!d) return ''; const x = String(d).split('-'); return Number(x[1]) + '/' + Number(x[2]); };
const mktName = m => (m === 'US' ? '미국' : '국내');
const mktTag = m => (m === 'US' ? '🇺🇸' : '🇰🇷');
const status = D.meta.status || {};
const budgets = D.budgets || {};
const labels = D.meta.labels || {KR:'국내', US:'미국', ALL:'합산'};

/* ---------- header / menu ---------- */
(function header() {
  document.getElementById('hsub').textContent =
    (D.meta.asof ? '최근 매매 ' + D.meta.asof + ' · ' : '') +
    '기준 ' + String(D.meta.generated_at || '').slice(0, 16).replace('T', ' ');
  const b = document.getElementById('runbadge');
  b.textContent = status.dry_run ? 'DRY_RUN' : (status.live_orders ? '실전 가동' : '대기');
  b.className = 'run' + (status.dry_run ? ' dry' : (status.live_orders ? ' live' : ''));
})();

function renderMenu() {
  document.querySelectorAll('#menu button').forEach(b => {
    b.classList.toggle('on', b.dataset.m === marketFilter);
    b.onclick = () => { marketFilter = b.dataset.m; render(); };
  });
}

/* ---------- data pickers ---------- */
function periodSource(mode) {
  if (mode === 'all') {
    if (D.meta.has_trades) return { markets: D.totals, label: '전체 기간', example: false, list: [] };
    if (showExamples && D.examples) return { markets: D.examples.totals, label: '전체 기간', example: true, list: [] };
    return { markets: null, label: '전체 기간', example: false, list: [] };
  }
  const rows = (D.periods && D.periods[mode]) || [];
  if (rows.length) {
    return { markets: rows[0].markets,
             label: rows[0].label + (mode === 'week' ? ' 주간' : ' 월간'),
             example: false, list: rows.slice(0, 8) };
  }
  const ex = (showExamples && D.examples && (mode === 'week' ? D.examples.weeks : D.examples.months)) || [];
  return { markets: ex[0] ? ex[0].markets : null,
           label: (mode === 'week' ? '주간' : '월간'),
           example: !!ex.length, list: ex.slice(0, 8) };
}

function marketOf(m) {
  if (m === 'ALL') return null;
  return m;
}

/* ---------- sections ---------- */
function statusCard() {
  const s = status;
  const dep = Number(budgets.deposited_krw || D.meta.total_deposited_krw || 0);
  const bc = (k, cls) => {
    const b = budgets[k] || {};
    const avail = (b.available_krw != null ? b.available_krw : b.cap_krw) || 0;
    return `<div class="bc ${cls || ''}">
      <span>${k === 'ALL' ? '합산' : mktName(k)}</span>
      <b>${won(b.cap_krw || 0)}</b>
      <em>사용가능 ${wonShort(avail)}</em>
    </div>`;
  };
  return `
  <section class="card status">
    <div class="stline"><span class="dot"></span><b>${esc(s.badge || '준비 중')}</b></div>
    <p>${esc(s.detail || '')}</p>
    <div class="depline"><span>총 운용 예산</span><b>${won(dep)}</b></div>
    <div class="bgrid">${bc('KR')}${bc('US')}${bc('ALL', 'all')}</div>
    <div class="stfoot">입금이 늘면 <b>예산 상한과 비례 배분이 자동 반영</b>됩니다 · 각 시장은 자기 예산과 실제 예수금 중 작은 금액만 사용 · 실주문 ${s.live_orders ? '허용' : '차단'}${s.dry_run ? ' (dry_run)' : ''}</div>
  </section>`;
}

function emptyBanner() {
  if (D.meta.has_trades) return '';
  return `
  <section class="card empty">
    <div class="etitle">아직 실제 매매 기록이 없습니다</div>
    <p>첫 정규장 주기부터 자동매매 신호와 체결이 이 일지에 쌓입니다.</p>
    <button type="button" class="extoggle" id="extoggle">${showExamples ? '예시 숨기기' : '예시로 화면 보기'}</button>
  </section>`;
}

function segments() {
  const tabs = [['week', '이번 주'], ['month', '이번 달'], ['all', '전체']];
  return `<div class="seg">${tabs.map(([k, l]) =>
    `<button type="button" class="${periodMode === k ? 'on' : ''}" data-mode="${k}">${l}</button>`).join('')}</div>`;
}

function tiles(src, example) {
  if (!src) {
    return `<div class="tiles"><div class="tile"><span class="tname">기록 없음</span>
      <b class="tval flat">—</b><span class="tmeta">거래 0건</span></div></div>`;
  }
  const one = (m, cls) => {
    const s = src[m] || {};
    return `<div class="tile ${cls || ''}">
      <span class="tname">${m === 'ALL' ? '합산' : mktName(m)}${example ? ' <i class="ex">예시</i>' : ''}</span>
      <b class="tval ${dir(s.net_pnl)}">${sgn(s.net_pnl || 0)}</b>
      <span class="tmeta">${pct(s.return_pct || 0)} · ${KR(s.trades || 0)}건</span>
    </div>`;
  };
  if (marketFilter === 'ALL') return `<div class="tiles">${one('KR')}${one('US')}${one('ALL', 'sum')}</div>`;
  return `<div class="tiles two">${one(marketFilter, 'sum')}${one('ALL')}</div>`;
}

function periodList(list, mode) {
  if (!list || !list.length) return '';
  const show = marketFilter === 'ALL' ? ['KR', 'US', 'ALL'] : [marketFilter];
  const head = `<div class="phead ${marketFilter === 'ALL' ? '' : 'one'}">
      <span>${mode === 'week' ? '주' : '월'}</span>${show.map(m => `<span>${m === 'ALL' ? '합산' : mktName(m)}</span>`).join('')}
    </div>`;
  const rows = list.map(p => {
    const cells = show.map(m => {
      const s = (p.markets && p.markets[m]) || {};
      return `<span class="${m === 'ALL' ? 'ptotal' : 'pside'} ${dir(s.net_pnl)}">${sgn(s.net_pnl || 0)}</span>`;
    }).join('');
    return `<div class="prow ${marketFilter === 'ALL' ? '' : 'one'}">
      <span class="plabel">${esc(p.label)}</span>${cells}</div>`;
  }).join('');
  return `<div class="plist">${head}${rows}</div>`;
}

function summarySection() {
  const src = periodSource(periodMode);
  return `
  <div class="sec"><h2>기간 수익</h2><span>${esc(src.label || '')}${src.example ? ' · 예시' : ''}</span></div>
  ${segments()}
  <section class="card summary ${src.example ? 'is-example' : ''}">
    ${tiles(src.markets, src.example)}
    <div class="snote">수익률은 기간 시작 자본 대비 순손익 기준입니다.</div>
  </section>
  ${src.list && src.list.length ? `<section class="card plistcard">${periodList(src.list, periodMode)}</section>` : ''}`;
}

function journalRows(trades) {
  return (trades || []).map(t => {
    const buy = t.buy_reason || '';
    const sell = t.sell_reason_label || t.sell_reason || '';
    return `<article class="tr" tabindex="0">
      <div class="trtop">
        <span class="mkt ${t.market === 'US' ? 'us' : 'kr'}">${mktTag(t.market)} ${mktName(t.market)}</span>
        <b class="tname">${esc(t.name)}</b>
        <span class="sym">${esc(t.symbol)}</span>
        <b class="pnl ${dir(t.pnl)}">${sgn(t.pnl)}</b>
      </div>
      <div class="trmid">
        <span class="rate ${dir(t.pnl)}">${pct(t.pnl_pct)}</span>
        <span>${esc(t.entry_time || '')} → ${esc(t.exit_time || '')}</span>
        <span>${KR(t.shares)}주</span>
        <span>${won(t.entry_price)} → ${won(t.exit_price)}</span>
      </div>
      <div class="why"><span class="lbl buy">매수</span><span class="txt">${esc(buy || '기록 없음')}</span></div>
      <div class="why"><span class="lbl sell">매도</span><span class="txt">${esc(sell || '기록 없음')}</span></div>
    </article>`;
  }).join('');
}

function filteredDay(day) {
  const trades = (day.trades || []).filter(t => marketFilter === 'ALL' || t.market === marketFilter);
  if (!trades.length) return null;
  const pnl = trades.reduce((a, t) => a + (Number(t.pnl) || 0), 0);
  return { date: day.date, weekday: day.weekday, trades, pnl, count: trades.length };
}

function dayCard(day, example) {
  return `<section class="card day ${example ? 'is-example' : ''}">
    <div class="dayhead">
      <b>${md(day.date)} <em>${esc(day.weekday || '')}</em></b>
      <span class="${dir(day.pnl)}">${sgn(day.pnl)}${example ? ' <i class="ex">예시</i>' : ''}</span>
    </div>
    ${journalRows(day.trades)}
  </section>`;
}

function journalSection() {
  const source = D.meta.has_trades ? (D.journal || [])
    : (showExamples && D.examples ? (D.examples.days || []) : []);
  const example = !D.meta.has_trades && showExamples;
  const days = source.map(filteredDay).filter(Boolean);
  const filterName = marketFilter === 'ALL' ? '' : ' · ' + mktName(marketFilter);
  if (!days.length) {
    return `<div class="sec"><h2>일별 매매일지</h2><span>0건${filterName}</span></div>
      <section class="card empty"><div class="etitle">기록 없음</div><p>${D.meta.has_trades ? '이 시장의 체결 기록이 아직 없습니다.' : '아직 체결된 매매가 없습니다.'}</p></section>`;
  }
  const n = days.reduce((a, d) => a + d.count, 0);
  return `<div class="sec"><h2>일별 매매일지</h2><span>${n}건 · ${days.length}일${filterName}${example ? ' · 예시' : ''}</span></div>
    ${example ? `<div class="exnote">아래 일지는 화면 예시입니다. 실제 체결 기록이 아닙니다.</div>` : ''}
    ${days.slice(0, 30).map(d => dayCard(d, example)).join('')}`;
}

function improvementsSection() {
  let rows = (D.improvements && D.improvements.length) ? D.improvements
    : (showExamples && D.examples ? (D.examples.improvements || []) : []);
  const example = !(D.improvements && D.improvements.length) && showExamples;
  if (marketFilter !== 'ALL') rows = rows.filter(e => !e.market || e.market === 'ALL' || e.market === marketFilter);
  const filterName = marketFilter === 'ALL' ? '' : ' · ' + mktName(marketFilter);
  if (!rows.length) {
    return `<div class="sec"><h2>알고리즘 개선 기록</h2><span>0건${filterName}</span></div>
      <section class="card empty"><div class="etitle">기록 없음</div><p>파라미터 변경·가드레일 작동이 여기에 쌓입니다.</p></section>`;
  }
  const items = rows.slice(0, 20).map(e => `
    <article class="imp">
      <div class="imphead">
        <span class="chip ${esc(e.source || 'manual')}">${esc(e.source_label || e.source || '기록')}</span>
        <b>${esc(e.title)}</b>
        <span class="idate">${md(e.date)}</span>
      </div>
      <div class="impchg">${esc(e.change || '')}</div>
      <div class="impreason">왜: ${esc(e.reason || '')}</div>
    </article>`).join('');
  return `<div class="sec"><h2>알고리즘 개선 기록</h2><span>${rows.length}건${filterName}${example ? ' · 예시' : ''}</span></div>
    ${example ? `<div class="exnote">아래 기록은 예시입니다.</div>` : ''}
    <section class="card implist">${items}</section>`;
}

function universeSection() {
  const u = D.universe || {};
  const keys = marketFilter === 'ALL' ? ['KR', 'US'] : [marketFilter];
  const blocks = keys.map(m => {
    const x = u[m]; if (!x) return '';
    const names = (x.symbols || []).map(s => s.name).join(' · ');
    const ex = (x.excluded || []).map(e => e.name + '(' + (e.price_krw ? KR(e.price_krw) + '원' : '$' + e.price_usd) + ')').join(' · ');
    return `<div class="uni">
      <div class="unihead"><b>${mktTag(m)} ${mktName(m)}</b><span>1주 한도 ${won(x.max_entry_krw || 0)}</span></div>
      <p><span class="ul">대상</span>${esc(names)}</p>
      <p><span class="ul ex2">제외</span>${esc(ex)}</p>
    </div>`;
  }).join('');
  if (!blocks) return '';
  return `<div class="sec"><h2>매매 대상</h2><span>1주도 못 사는 고가주 제외</span></div>
    <section class="card uni-card">${blocks}</section>`;
}

function footer() {
  return `<section class="card foot">
    <div class="fh">기준과 한계</div>
    <p>${esc(D.meta.disclaimer || '')}</p>
    <p class="warn">이 페이지는 공개 경로에 있지만 검색 노출은 막혀 있습니다. 계좌번호·API 키는 담지 않습니다.</p>
    <div class="meta2">생성 ${esc(String(D.meta.generated_at || '').slice(0, 16).replace('T', ' '))} · 주식 자동매매 v1.2</div>
  </section>`;
}

/* ---------- render ---------- */
function render() {
  document.getElementById('view').innerHTML = `
    ${statusCard()}
    ${emptyBanner()}
    ${summarySection()}
    ${journalSection()}
    ${improvementsSection()}
    ${universeSection()}
    ${footer()}`;
  renderMenu();
  const ex = document.getElementById('extoggle');
  if (ex) ex.onclick = () => { showExamples = !showExamples; render(); };
  document.querySelectorAll('.seg button').forEach(b => {
    b.addEventListener('click', () => { periodMode = b.dataset.mode; render(); });
  });
  document.querySelectorAll('.tr').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('open'));
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') el.classList.toggle('open'); });
  });
}
render();
</script>
