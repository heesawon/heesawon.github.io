const KR   = n => Math.round(n).toLocaleString('ko-KR');
const won  = n => KR(n) + '원';
const sgn  = n => (n > 0 ? '+' : n < 0 ? '−' : '') + KR(Math.abs(n)) + '원';
const pctv = n => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2) + '%';
const dir  = n => (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
const usd  = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const price = (p, v) => p.mkt === 'US' ? usd(v) : KR(v) + '원';
const md = d => { const x = d.split('-'); return Number(x[1]) + '/' + Number(x[2]); };
const mkName = m => m === 'KR' ? '국내' : '미국';

function heroCard() {
  const d = DATA;
  return `
  <section class="hero">
    <div class="hlabel">총 평가액</div>
    <div class="hbig">${KR(d.total)}<span>원</span></div>
    <div class="hpill"><b>${d.pnl >= 0 ? '▲' : '▼'}</b>${sgn(d.pnl)} <em>${pctv(d.pnl_pct)}</em></div>
    <div class="hstats">
      <div><span>시드</span><b>${KR(d.seed)}원</b></div>
      <div><span>누적 수익률</span><b class="hpos">${pctv(d.pnl_pct)}</b></div>
      <div><span>현금 비중</span><b>${d.cash_pct.toFixed(1)}%</b></div>
    </div>
  </section>
  <div class="herofoot">
    <span>투자 ${KR(d.stock)}원 · 보유 ${d.positions.length}종목</span>
    <span>현금 ${KR(d.cash)}원</span>
  </div>`;
}

function posRow(p) {
  const at = Math.min(100, Math.max(0, (p.now - p.stop) / (p.tp - p.stop) * 100));
  return `
  <div class="card pos">
    <div class="p-top">
      <div class="p-name"><b>${p.name}</b><span class="mkt">${mkName(p.mkt)} · ${p.sym.replace('.KS','')}</span></div>
      <div class="p-ret ${dir(p.ret)}"><b>${pctv(p.ret)}</b><span>${sgn(p.pnl)}</span></div>
    </div>
    <div class="p-mid">
      <span class="tag">눌림목</span>
      <span class="p-px">${price(p, p.entry)} <i>→</i> <b>${price(p, p.now)}</b></span>
      <span class="p-days">${md(p.date)} 매수</span>
    </div>
    <div class="bar"><i style="left:calc(${at}% - 5px)"></i></div>
    <div class="p-foot">
      <span>손절 ${price(p, p.stop)}</span>
      <span class="p-why">200일선 +${p.above200}% · RSI ${p.rsi}</span>
      <span>익절 ${price(p, p.tp)}</span>
    </div>
  </div>`;
}

function tradeRow(t) {
  const buy = t.side === '매수';
  const right = buy
    ? `<b class="amt">${KR(t.krw)}원</b>`
    : `<b class="amt ${dir(t.pnl)}">${sgn(t.pnl)}</b>`;
  const sub = buy
    ? `<span class="tag">눌림목</span>${t.reason}`
    : `<span class="tag t-red">${t.reason}</span>${t.days}일 보유 · ${pctv(t.ret)}`;
  return `
  <div class="tr">
    <div class="tr-top">
      <span class="side ${buy ? 's-buy' : 's-sell'}">${t.side}</span>
      <b class="tr-nm">${t.name}</b>
      <span class="tr-dt">${md(t.date)}</span>
      ${right}
    </div>
    <div class="tr-sub">${sub}</div>
  </div>`;
}
