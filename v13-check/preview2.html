<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>v13 미리보기</title>
<style>
  html,body{margin:0;padding:0;background:#DDD9D0;}
  #stage{width:390px;height:1100px;transform:scale(.9);transform-origin:top left;}
  iframe{width:390px;height:1100px;border:0;display:block;background:#F7F5F0;}
</style></head>
<body>
<div id="stage"><iframe id="f" src="./index.html?v=13"></iframe></div>
<script>
document.getElementById('f').addEventListener('load',function(){
  try{
    var w=this.contentWindow,d=this.contentDocument;
    var el=d.querySelector('.inv-sum').closest('section');
    var y=el.getBoundingClientRect().top+w.scrollY-72;
    w.scrollTo(0,Math.max(0,y));
  }catch(e){document.title='ERR '+e.message;}
});
</script>
</body></html>
